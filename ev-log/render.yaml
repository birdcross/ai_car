# Render 배포 설정 (GitHub 저장소 연결 → New → Blueprint)
# 백엔드가 프론트(frontend/)까지 함께 서빙하므로 서비스 하나로 끝납니다.
services:
  - type: web
    name: ev-log
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GEMINI_API_KEY
        sync: false          # Render 대시보드에서 직접 입력
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DATA_DIR
        value: ./data
    # ⚠ 주의: free 플랜은 15분간 요청이 없으면 잠들고, 그때마다(재배포·재시작 포함) 로컬 파일이 지워집니다.
    #   → SQLite 기록·사진이 사라지므로 시연용으로만 쓰세요.
    # 실사용자 테스트 기간에는 유료 인스턴스(Starter) + 아래 디스크를 쓰거나, DB·사진을 Supabase로 옮기세요.
    # disk:
    #   name: evlog-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # (이때 DATA_DIR 값을 /var/data 로 변경)
